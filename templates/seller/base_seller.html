{% load static %}
<!doctype html>
<html lang="en">
<head>
    <!-- Seller pages share Bootstrap but use a separate navigation shell. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Seller workspace | MarketBridge{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/marketplace.css' %}">
</head>
<body class="seller-body">
    <!-- The sidebar makes seller tasks visibly separate from the buyer storefront. -->
    <div class="d-lg-flex min-vh-100">
        <aside class="seller-sidebar text-white p-4 d-flex flex-column">
            <a class="text-white text-decoration-none" href="{% url 'products:seller_dashboard' %}">
                <span class="eyebrow text-warning">MARKETBRIDGE SELLER</span>
                <div class="h4 fw-bold mt-2 mb-0">{{ user.shop_name }}</div>
            </a>
            <nav class="nav flex-column gap-1 mt-5">
                <a class="nav-link" href="{% url 'products:seller_dashboard' %}">Overview</a>
                <a class="nav-link" href="{% url 'products:seller_product_list' %}">Products</a>
                <a class="nav-link" href="{% url 'orders:seller_order_list' %}">Incoming orders</a>
            </nav>
            <div class="mt-auto pt-5">
                <a class="nav-link px-0 text-white-50" href="{% url 'products:home' %}">View storefront</a>
                <form action="{% url 'accounts:logout' %}" method="post" class="mt-2">
                    {% csrf_token %}
                    <button class="btn btn-outline-light w-100" type="submit">Sign out</button>
                </form>
            </div>
        </aside>
        <div class="flex-grow-1">
            <!-- Seller pages receive feedback in the same place after every redirect. -->
            <div class="container-fluid px-4 px-xl-5 pt-4">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
            <main class="container-fluid px-4 px-xl-5 pb-5">{% block content %}{% endblock %}</main>
        </div>
    </div>
    <!-- Bootstrap enables alert dismissal while all marketplace behavior stays server-rendered. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
